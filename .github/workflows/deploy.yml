name: Deploy

# Manual only: Actions > Deploy > Run workflow.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [dev]
        default: dev

permissions:
  contents: read
  id-token: write # OIDC token for assuming the AWS deploy role

# Never run two deploys of the same stage at once (CloudFormation and SQLite).
concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The deploy role trusts only jobs that run in a GitHub environment of this
    # repository. AWS_DEPLOY_ROLE_ARN is a variable of that environment.
    env:
      STAGE: ${{ inputs.stage || 'dev' }}
    environment:
      name: ${{ inputs.stage || 'dev' }}
      url: ${{ steps.endpoint.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy and migrate
        run: bin/aws-release "$STAGE"

      - name: Get the endpoint
        id: endpoint
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "sample-laravel-bref-$STAGE" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: E2E tests against the deployed stage
        run: bin/e2e "${{ steps.endpoint.outputs.url }}"

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
