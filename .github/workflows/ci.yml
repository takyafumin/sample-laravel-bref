name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (gitleaks, Pint, Larastan, Prettier, ShellCheck, Hadolint, compose, actionlint)
        run: bin/lint

      - name: Test
        run: php artisan test

  e2e:
    # The local stack runs the arm64 Bref runtime image (bref/arm-php-85).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # The Lambda containers run as uid 993 and create the SQLite file here.
          mkdir -p .docker-data/db
          chmod 777 .docker-data/db

      - name: E2E tests (Playwright against the local Lambda stack)
        run: bin/e2e

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color web artisan gateway

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
