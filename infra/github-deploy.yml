AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Roles for deploying sample-laravel-bref from GitHub Actions (OIDC, no long-lived keys).
  Deploy once per AWS account with bin/aws-bootstrap-github-deploy (docs/github-actions-deploy.md).

# Three layers, so that the GitHub role cannot escalate its own privileges:
#   1. GitHubDeployRole   - assumed by GitHub Actions through OIDC. Can only drive
#                           CloudFormation for the app stacks, upload packages, read
#                           the APP_KEY parameter and invoke the app functions.
#   2. CloudFormationRole - passed to CloudFormation (serverless.yml
#                           provider.iam.deploymentRole). Creates the app resources,
#                           limited to resources named sample-laravel-bref-*.
#   3. WorkloadBoundary   - permissions boundary that every role created by
#                           CloudFormationRole must carry (Lambda execution role,
#                           S3 Files sync role). It caps what those roles can do.
# None of these resources match the sample-laravel-bref-* patterns the roles are
# allowed to manage, so the roles cannot modify themselves or this stack.

Parameters:
  GitHubSubjectPrefix:
    Type: String
    # This repository uses GitHub's immutable OIDC subject (owner and repository
    # IDs included, so a renamed or recreated repository cannot match). Get it with:
    #   gh api repos/OWNER/REPO/actions/oidc/customization/sub --jq .sub_claim_prefix
    Default: repo:takyafumin@8556203/sample-laravel-bref@1458494208
    AllowedPattern: '^repo:[^*?]+$'
    Description: >-
      OIDC subject prefix of the repository whose workflows may assume the deploy role
      (sub_claim_prefix of the repository's OIDC customization; no wildcards)
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Create the token.actions.githubusercontent.com OIDC provider. Use false when the
      account already has it (an account can hold only one per URL).

  GitHubEnvironment:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'
    Description: >-
      GitHub environment (= stage) whose jobs may assume the deploy role. The deploy
      role can only touch that stage's stack, package bucket, APP_KEY and functions.

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  WorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: github-deploy-sample-laravel-bref-workload-boundary
      Description: Permissions boundary for the roles of the sample-laravel-bref app stacks
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Lambda: logs and VPC networking (AWSLambdaVPCAccessExecutionRole)
          - Sid: LambdaLogsAndVpc
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          # Lambda: mount the S3 file system
          - Sid: S3FilesClient
            Effect: Allow
            Action:
              - s3files:ClientMount
              - s3files:ClientWrite
            Resource: '*'
          # S3 Files sync role: the database bucket
          - Sid: DatabaseBucket
            Effect: Allow
            Action: s3:*
            Resource:
              - arn:aws:s3:::sample-laravel-bref-*
              - arn:aws:s3:::sample-laravel-bref-*/*
          # S3 Files sync role: EventBridge rules it manages for change notifications
          - Sid: S3FilesEventRules
            Effect: Allow
            Action: events:*
            Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-S3-Files*
          - Sid: S3FilesEventRulesRead
            Effect: Allow
            Action:
              - events:DescribeRule
              - events:ListTargetsByRule
              - events:ListRuleNamesByTarget
              - events:ListRules
            Resource: '*'

  CloudFormationRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3037]
    Properties:
      RoleName: github-deploy-sample-laravel-bref-cfn
      Description: Used by CloudFormation to create the sample-laravel-bref app stacks
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: deploy-app-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # API Gateway HTTP API. TagResource is required when creating a
              # stage (cfn-lint's action list does not know it: W3037 ignored).
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
              # VPC, subnets and security groups. Creating them cannot be limited
              # by name, so limit by region.
              - Sid: NetworkCreate
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:CreateSubnet
                  - ec2:CreateSecurityGroup
                  - ec2:CreateTags
                  - ec2:Describe*
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:CreateNetworkInterfacePermission
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Changing or deleting them: only resources of the app stacks, by the
              # aws:cloudformation:stack-name tag (aws: tags cannot be set by users).
              - Sid: NetworkChange
                Effect: Allow
                Action:
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DeleteTags
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
                  StringLike:
                    aws:ResourceTag/aws:cloudformation:stack-name: sample-laravel-bref-*
              # Roles of the app stack must carry the workload boundary
              - Sid: AppRolesWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/sample-laravel-bref-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref WorkloadBoundary
              - Sid: AppRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:DeleteRolePolicy
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/sample-laravel-bref-*
              - Sid: PassAppRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/sample-laravel-bref-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - elasticfilesystem.amazonaws.com
                      - s3files.amazonaws.com
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - elasticfilesystem.amazonaws.com
                      - s3files.amazonaws.com
              # Lambda functions of the app stack
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sample-laravel-bref-*
              - Sid: LambdaLayers
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource: '*'
              # Log groups of the functions
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sample-laravel-bref-*
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              # Deployment bucket and database bucket. Objects are written by
              # the deploy role (packages) and S3 Files (database), not here.
              - Sid: Buckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:Get*
                  - s3:List*
                  - s3:PutBucket*
                  - s3:DeleteBucketPolicy
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                Resource: arn:aws:s3:::sample-laravel-bref-*
              # Creating an S3 Files file system sets up its EventBridge rules
              # with the caller's credentials (same as the sync role's grants)
              - Sid: S3FilesEventRules
                Effect: Allow
                Action: events:*
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-S3-Files*
              - Sid: S3FilesEventRulesRead
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                  - events:ListRuleNamesByTarget
                  - events:ListRules
                Resource: '*'
              # S3 Files file system, mount targets and access point
              - Sid: S3Files
                Effect: Allow
                Action: s3files:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-deploy-sample-laravel-bref
      Description: Assumed by GitHub Actions (OIDC) to deploy the sample-laravel-bref app stacks
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs that run in this environment of this repository.
                # Restrict the environment to the main branch in GitHub (docs/github-actions-deploy.md).
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Create and update the stage's stack. No DeleteStack, but an update can
              # still remove resources: this is not a guard against destructive changes.
              - Sid: AppStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sample-laravel-bref-${GitHubEnvironment}/*
              # serverless.yml reads the role ARNs from this stack (${cf:...})
              - Sid: ReadThisStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Sid: ValidateTemplate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              # Upload the deployment package to the deployment bucket
              - Sid: DeploymentBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::sample-laravel-bref-${GitHubEnvironment}-serverlessdeploymentbuck*
                  - !Sub arn:aws:s3:::sample-laravel-bref-${GitHubEnvironment}-serverlessdeploymentbuck*/*
              # APP_KEY is resolved at deploy time
              - Sid: AppKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sample-laravel-bref/${GitHubEnvironment}/app-key
              - Sid: DecryptAppKey
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
              # Run artisan (migrations) and read function details
              - Sid: AppFunctions
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sample-laravel-bref-${GitHubEnvironment}-*

Outputs:
  GitHubDeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable of the GitHub environment
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationRoleArn:
    Description: Used by serverless.yml (provider.iam.deploymentRole)
    Value: !GetAtt CloudFormationRole.Arn
  WorkloadBoundaryArn:
    Description: Used by serverless.yml (permissions boundary of the app roles)
    Value: !Ref WorkloadBoundary
